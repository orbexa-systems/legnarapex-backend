# ── Servidor ──────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── Base de datos (Supabase PostgreSQL) ───────────────────────────────────────
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
# Skip isolated JDBC connection at startup — dialect is declared explicitly
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# ── HikariCP connection pool ──────────────────────────────────────────────────
# Supabase session-mode pooler limit is 15 across all instances (prod + staging)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# ── Cloudflare R2 ─────────────────────────────────────────────────────────────
r2.account-id=${R2_ACCOUNT_ID}
r2.access-key-id=${R2_ACCESS_KEY_ID}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY}
r2.bucket-name=${R2_BUCKET_NAME:legnarapex-fotos}
r2.public-url=${R2_PUBLIC_URL}

# ── CORS ──────────────────────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ── Multipart ─────────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=500MB

# ── Zona horaria ──────────────────────────────────────────────────────────────
spring.jackson.time-zone=America/Mexico_City

# ── Compresión HTTP ───────────────────────────────────────────────────────────
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain
server.compression.min-response-size=1024

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.orbexasystems=INFO
